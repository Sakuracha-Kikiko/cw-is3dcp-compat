modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Keep this file ASCII-only: it is filtered by build.gradle and by build-offline.ps1,
# and non-ASCII comments get mangled by Windows PowerShell 5.1 / platform default charsets.

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# This mod references Iron's SpellPreCastEvent, so Iron's must be present.
[[dependencies."${mod_id}"]]
modId = "irons_spellbooks"
type = "required"
versionRange = "[1.21.1-3.16.0,)"
ordering = "AFTER"
side = "BOTH"

# The effect is looked up by registry name only, so a missing Create: Wizardry is harmless
# (this entry just forces a late load order).
[[dependencies."${mod_id}"]]
modId = "create_wizardry"
type = "optional"
versionRange = "${create_wizardry_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "iss_ponder"
type = "optional"
versionRange = "${iss_ponder_version_range}"
ordering = "AFTER"
side = "BOTH"
